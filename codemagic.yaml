workflows:
  unsigned-ios-build:
    name: Build Unsigned iOS IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install CocoaPods (if applicable)
        script: |
          if [ -f "ios/Podfile" ]; then cd ios && pod install; fi
      - name: Build unsigned .app
        script: |
          xcodebuild build \
            -workspace "YourApp.xcworkspace" \
            -scheme "YourApp" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package .app into unsigned .ipa
        script: |
          mkdir -p Payload
          cp -r $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/*.app Payload/
          zip -r unsigned_app.ipa Payload
    artifacts:
      - unsigned_app.ipa